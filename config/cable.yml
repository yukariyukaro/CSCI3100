development:
  adapter: async
  channel_prefix: cuhk_marketplace_development

test:
  adapter: test
  channel_prefix: cuhk_marketplace_test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: cuhk_marketplace_production
  ssl_params:
    verify_mode: <%= OpenSSL::SSL::VERIFY_NONE %>
