# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  auth:
    logged_in: "You are logged in."
    logged_out: "You are logged out."
    invalid_credentials: "Invalid email or password."
    login_required: "You must be logged in."
  users:
    profile:
      updated: "Profile updated successfully."
      current_password_invalid: "Current password is invalid."
    update:
      success: "Profile updated successfully."
  transactions:
    reserve_success: "Reservation successful!"
    reserve_failed: "Cannot reserve this product."
    cancel_success: "Reservation cancelled."
    cancel_failed: "Cannot cancel reservation."
    sold_success: "Product marked as sold."
    sold_failed: "Cannot mark as sold."
  payments:
    empty: "No payments yet."
    success: "Payment successful! Your order has been confirmed."
    cancelled: "Payment was cancelled."
    errors:
      not_payable: "This transaction is not payable."
    manual_intervention:
      resolved: "Marked as resolved."
  controllers:
    users:
      update:
        success: "Profile updated successfully."
  conversations:
    product_not_found: "Product not found."
  listings:
    create:
      success: "Product published successfully!"
    errors:
      image_too_large: "Image must be smaller than 5MB"
      image_invalid_type: "Image must be a JPEG or PNG file"
      quota_exceeded: "Listing quota exceeded for your community."
  flash:
    success: "Operation successful."
    access_denied: "You do not have permission to perform this action."
    login_required: "You must be logged in to continue."
    warning: "Please review before continuing."
    info: "Here is some information for you."
